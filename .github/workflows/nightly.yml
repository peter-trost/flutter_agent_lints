# Runs the same checks against the latest stable Dart SDK once a day. This is
# what catches external drift: a new SDK deprecating or removing a rule, or a
# new diagnostic the file has not decided on yet.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      dart-sdk: stable
