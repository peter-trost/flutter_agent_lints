# Reusable check suite. Called by ci.yml (pinned SDK, on every PR) and by
# nightly.yml (latest stable SDK, catches drift caused by new Dart releases).
name: Checks

on:
  workflow_call:
    inputs:
      dart-sdk:
        description: >-
          Dart SDK to test with. "pubspec" resolves to the lower bound of
          environment.sdk in pubspec.yaml; anything else is passed to
          setup-dart verbatim (for example "stable" or "3.14.0").
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ inputs.dart-sdk }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Dart SDK version
        id: sdk
        run: |
          if [ "${{ inputs.dart-sdk }}" = "pubspec" ]; then
            version="$(yq -r '.environment.sdk' pubspec.yaml | sed 's/[^0-9.]//g')"
          else
            version="${{ inputs.dart-sdk }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ steps.sdk.outputs.version }}

      - run: dart --version

      - run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos
