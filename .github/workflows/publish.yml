# Publishes the tagged version to pub.dev through pub.dev's automated
# publishing: the job's GitHub OIDC token proves the run came from this
# repository on a v<version> tag. No credential is stored. pub.dev is
# configured with the tag pattern v{{version}} on the package's admin page.
#
# Skips a version pub.dev already has, so the tag that release.yml creates
# for the hand-published first version does not fail here.
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pubdev.outputs.publish }}
    steps:
      - name: Does pub.dev already have this version?
        id: pubdev
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsS https://pub.dev/api/packages/flutter_agent_lints | jq -e --arg v "$version" '.versions[].version | select(. == $v)' >/dev/null; then
            echo "pub.dev already has $version; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
