# flutter_agent_lints, experimental variant
#
# Everything in analysis_options.yaml plus the rules the Dart SDK still marks
# experimental. Experimental rules can be renamed or removed between SDK
# releases, which would break analysis for every consumer on upgrade, so they
# are opt-in:
#
#   include: package:flutter_agent_lints/experimental.yaml
#
# Same contract as the main file: every experimental rule of the targeted SDK
# appears here exactly once, as `true` or `false`, with a reason.

include: analysis_options.yaml

linter:
  rules:
    annotate_redeclares: true # An unannotated redeclaration in an extension type is indistinguishable from a typo.
    avoid_futureor_void: true # `FutureOr<void>` cannot be awaited meaningfully; it is always a type error waiting to happen.
    implicit_reopen: true # Reopening a sealed hierarchy must be written `@reopen` or it is an accident.
    invalid_case_patterns: true # Case expressions that Dart 3 parses differently from Dart 2 are rewritten unambiguously.
    no_default_cases: true # A `default` hides new enum values from the exhaustiveness check; list every case.
    unnecessary_async: true # An `async` body without `await` is overhead and hides that nothing is asynchronous.
    unsafe_variance: true # A type variable in a non-covariant position is a runtime type error the checker cannot see.
    use_late_for_private_fields_and_variables: false # Trades a compile-time null check for a runtime `LateInitializationError`.
    use_primary_constructors: true # One constructor form where the language offers two.
    use_super_parameters: true # `super.x` replaces forwarding boilerplate; one form.
    var_with_no_type_annotation: true # An untyped `var` parameter is `dynamic`; the type must be written.
